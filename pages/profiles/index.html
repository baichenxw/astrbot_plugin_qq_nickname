<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="title" >用户资料</title><link rel="stylesheet" href="./style.css"></head>
<body><main>
<header><div><span data-i18n="brand" class="eyebrow">QQ 身份绑定</span><h1 data-i18n="title" >用户资料</h1><p data-i18n="intro" >管理昵称与 QQ 号，让每轮对话都能识别用户。</p></div><button data-i18n="add" id="add" class="primary">＋ 添加绑定</button></header>
<div class="notice"><span data-i18n="notice" >每条消息自动补全发送者 ID 和昵称</span><small data-i18n="identity_notice" >原始 OpenID 保留用于会话与核心权限；填写的 QQ 号属于自报资料。</small></div>
<section class="card settings"><label class="switch-label"><input id="backend-only" type="checkbox" role="switch" disabled><span data-i18n="backend_only" >仅允许后台管理资料</span></label><p data-i18n="backend_hint" >默认关闭。开启后，所有 QQ 用户（包括管理员）的本插件命令及其别名均被禁用，只能在本后台管理资料。已绑定资料仍正常用于对话。</p><p id="settings-status" role="status" aria-live="polite"></p></section>
<section class="card"><div class="toolbar"><form id="search-form"><input id="search" data-i18n-aria="search_label" aria-label="搜索用户" data-i18n-placeholder="search_hint" placeholder="搜索昵称、QQ 号或 OpenID" maxlength="128"><button data-i18n="search" >搜索</button></form><button data-i18n="refresh" id="refresh">刷新</button></div>
<p id="status" role="status" aria-live="polite"></p><div class="table-wrap"><table><thead><tr><th data-i18n="nickname" >昵称</th><th data-i18n="qq" >绑定 QQ 号</th><th data-i18n="original_identity" >原始 OpenID / 机器人</th><th data-i18n="updated" >更新时间</th><th data-i18n="actions" >操作</th></tr></thead><tbody id="users"></tbody></table></div>
<div id="empty" hidden></div><footer><span id="count"></span><div><button data-i18n="previous" id="prev">上一页</button><button data-i18n="next" id="next">下一页</button></div></footer></section>
</main>
<dialog id="editor"><form id="edit-form"><h2 id="edit-title"></h2><label><span data-i18n="bot" >机器人</span><select id="bot" required></select></label><label><span data-i18n="openid" >原始 OpenID</span><input id="openid" required maxlength="128" data-i18n-placeholder="openid_hint" placeholder="原始平台 UID；可从 UMO 获取"></label><label><span data-i18n="nickname" >昵称</span><input id="nickname" maxlength="32" data-i18n-placeholder="nickname_hint" placeholder="最多 32 个字符；留空清除"></label><label><span data-i18n="qq" >绑定 QQ 号</span><input id="qq" inputmode="numeric" pattern="[1-9][0-9]{4,11}" maxlength="12" data-i18n-placeholder="qq_hint" placeholder="5–12 位数字；留空清除"></label><p id="edit-error" role="alert"></p><div class="actions"><button data-i18n="cancel" type="button" id="cancel">取消</button><button data-i18n="save" class="primary" id="save">保存资料</button></div></form></dialog>
<dialog id="delete-dialog"><h2 data-i18n="delete_title" >删除绑定资料？</h2><p id="delete-name"></p><p data-i18n="delete_hint" >删除后恢复平台原始身份展示，已有对话和权限保留。</p><div class="actions"><button data-i18n="cancel" id="delete-cancel">取消</button><button data-i18n="delete_profile" class="danger" id="delete-confirm">删除绑定</button></div></dialog>
<script type="module" src="./app.js"></script></body></html>
